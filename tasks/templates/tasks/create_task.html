{% extends 'base.html' %}


{% block title %}
    Create Task
{% endblock %}


{% block content %}

    <div class="form-container">

        <div class="page-header">

            <div>
                <h1>{% if task %}
                    Edit Task
                {% else %}
                    Create Task
                {% endif %}</h1>
                <p>Add a new task to your list.</p>
            </div>

        </div>


        <form method="POST" class="task-form">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">

                <button type="submit" class="btn">
                    {% if task %}
                        Update Task
                    {% else %}
                        Create Task
                    {% endif %}
                </button>

                <a href="{% url 'task_list' %}" class="cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

{% endblock %}
