{% extends 'base.html' %}


{% block title %}
    Login
{% endblock %}


{% block content %}

    <div class="form-container">

        <div class="page-header">

            <div>
                <h1>Login</h1>
                <p>Sign in to manage your tasks.</p>
            </div>

        </div>


        <form method="POST" class="task-form">

            {% csrf_token %}

            {{ form.as_p }}


            <div class="form-actions">

                <button type="submit" class="btn">
                    Login
                </button>

                <a
                    href="{% url 'register' %}"
                    class="cancel-btn"
                >
                    Don't have an account?
                </a>

            </div>

        </form>

    </div>

{% endblock %}
